name: Backtest

# 手動觸發的長窗回測(~2 年)。獨立於晨報/CI,不寄信、不影響排程。
# 在 GitHub Actions 跑是因為這裡抓得到 Yahoo 歷史(本機開發環境對 Yahoo 被 geo-block)。
on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          # 批#35 r2(Codex):**不**升級 pip——未鎖版 pip 會被下載並立即執行,
          # 而本 job 持有寫入權限/金鑰;runner 內建 pip 已足以做 --require-hashes 安裝。
          pip install -r requirements.lock

      - name: Run long-window backtest (us_beta / night-blend / strategies)
        env:
          TZ: Asia/Taipei
        run: |
          set -o pipefail   # 讓 backtest_runner 的非零退出(資料抓取失敗)真的讓 job 失敗,不被 tee 吃掉
          python backtest_runner.py | tee /tmp/backtest_results.txt

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: backtest-results
          path: /tmp/backtest_results.txt
          if-no-files-found: warn
