name: Backtest

# 手動觸發的長窗回測(~2 年)。獨立於晨報/CI,不寄信、不影響排程。
# 在 GitHub Actions 跑是因為這裡抓得到 Yahoo 歷史(本機開發環境對 Yahoo 被 geo-block)。
on:
  workflow_dispatch:

# r3(突變測試審查):全 8 個 workflow 中只有本檔與另一個沒宣告 permissions,
# 等於吃 repo 預設值。這兩個都不需要寫入權限。
permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          # 批#35 r2(Codex):**不**升級 pip——未鎖版 pip 會被下載並立即執行,
          # 而本 job 持有寫入權限/金鑰;runner 內建 pip 已足以做 --require-hashes 安裝。
          pip install -r requirements.lock

      - name: Run long-window backtest (us_beta / night-blend / strategies)
        env:
          TZ: Asia/Taipei
        run: |
          set -o pipefail   # 讓 backtest_runner 的非零退出(資料抓取失敗)真的讓 job 失敗,不被 tee 吃掉
          python backtest_runner.py | tee /tmp/backtest_results.txt

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: backtest-results
          path: /tmp/backtest_results.txt
          if-no-files-found: warn
