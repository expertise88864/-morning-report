name: CI

# 與每日寄信的 morning-report.yml 完全獨立；CI 不會寄信、不影響排程。
on:
  push:
  pull_request:
  workflow_dispatch:

# r3(突變測試審查):全 8 個 workflow 中只有本檔與另一個沒宣告 permissions,
# 等於吃 repo 預設值。這兩個都不需要寫入權限。
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          # 批#35 r2(Codex):**不**升級 pip——未鎖版 pip 會被下載並立即執行,
          # 而本 job 持有寫入權限/金鑰;runner 內建 pip 已足以做 --require-hashes 安裝。
          pip install -r requirements.lock
          pip install "ruff==0.15.15"

      # 全 repo 掃描,不再手寫模組清單(GPT-5.6 review P2:清單曾漏掉
      # render_utils/news_rules/session_calendar 等拆出模組,每次拆檔都要記得更新)
      - name: Syntax check
        run: python -m compileall -q . -x '(\.git|\.venv|__pycache__)'

      - name: Lint
        run: python -m ruff check .

      - name: Run unit tests
        run: python -m pytest -q

  # 手動觸發：用真實資料跑一次完整流程（不寄信），產出 HTML 預覽 artifact。
  # 連 Yahoo / TWSE / LLM，可能因外部服務不穩而失敗 —— 故設 continue-on-error，
  # 不影響 CI 綠燈，也不影響每日排程。
  #
  # 外審 P2-1:**這個 job 的設定必須與排程班一致**,否則它證明的是另一條路。
  # 先前 model 預設 v4-pro、effort 預設 high、`LLM_EVENT_EXTRACTION=0` ——
  # 而生產是 flash / max / 抽取器開啟、走特化結構化路徑。
  # 「canary 綠」在那個設定下不代表生產跑得起來,那正是這個 repo 反覆遇到的
  # 「測試全綠、生產零產出」的形狀。
  #
  # timeout 12 → 30 分鐘:max 推理下單次呼叫實測 81–313 秒,
  # 而總預算是 1200 秒(兩輪特化 + legacy 備援)—— 12 分鐘裝不下,
  # canary 會在證明任何事之前先被 job timeout 砍掉。
  dry-run-preview:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # **仍然 continue-on-error**:這個 job 連 Yahoo / TWSE / LLM,會因外部
    # 服務不穩而失敗;把它變成硬閘門只會訓練人忽略紅燈(這個 repo 為此
    # 拒絕過自動遮蔽)。價值在**它綠的時候綠得有意義** —— 下面那個斷言
    # 步驟讓「exit 0」不再等於「跑成了」。真正的每日守衛是
    # `report-watchdog.yml`,判準同一份。
    continue-on-error: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          # 批#35 r2(Codex):**不**升級 pip——未鎖版 pip 會被下載並立即執行,
          # 而本 job 持有寫入權限/金鑰;runner 內建 pip 已足以做 --require-hashes 安裝。
          pip install -r requirements.lock

      - name: Run morning report (DRY_RUN, no email)
        env:
          DRY_RUN: "1"
          # 以下四項**與 morning-report.yml 逐字相同** —— canary 的價值
          # 全部來自「跑的是同一條路」(外審 P2-1)。
          LLM_EVENT_EXTRACTION: "1"
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'deepseek' }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: deepseek-v4-flash
          DEEPSEEK_REASONING_EFFORT: ${{ vars.DEEPSEEK_REASONING_EFFORT || 'max' }}
          # 空字串 = 依 provider 自動選(deepseek → 特化結構化路徑),
          # 與排程班同一個逃生門語意。
          LLM_PRIMARY_PROMPT_PROFILE: ${{ vars.LLM_PRIMARY_PROMPT_PROFILE || '' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          TZ: Asia/Taipei
        run: python morning_report.py

      # **「跑完了、exit 0」證明不了什麼**:降級成 legacy、兩階段抓取
      # 整段 no-op、昨日觀點沒存下來 —— 三者都會 exit 0。canary 的綠燈
      # 必須代表「特化路徑真的走完了」,否則它只是一個很貴的 smoke test。
      # 判準與每日看門狗**同一份**(`run_quality.assess`)—— 兩份判準
      # 各自演化的話,「canary 綠而生產壞」會再發生一次。
      - name: Assert the run actually produced the specialized output
        if: always()
        run: python tools/assert_run_quality.py

      - name: Upload HTML preview
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: morning-report-preview
          path: /tmp/morning_report_preview.html
          if-no-files-found: warn
