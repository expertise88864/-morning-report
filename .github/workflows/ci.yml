name: CI

# 與每日寄信的 morning-report-b.yml 完全獨立；CI 不會寄信、不影響排程。
on:
  push:
  pull_request:
  workflow_dispatch:

# r3(突變測試審查):全 8 個 workflow 中只有本檔與另一個沒宣告 permissions,
# 等於吃 repo 預設值。這兩個都不需要寫入權限。
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # **量出來的,不是推出來的**(2026-09-04):實測整個 job 9 分 21 秒
    # (單元測試 8 分 56 秒),而上限是 10 分 —— 餘裕只有 39 秒。job 被
    # GitHub 砍掉時的紅燈與程式碼無關,而且訊息是「The operation was
    # canceled」,查起來又是一輪。上限仍然要有(卡死的測試會跑到天荒地老),
    # 但要留得下一次加測試的空間:20 分鐘 ≈ 實測的兩倍。
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          # 批#35 r2(Codex):**不**升級 pip——未鎖版 pip 會被下載並立即執行,
          # 而本 job 持有寫入權限/金鑰;runner 內建 pip 已足以做 --require-hashes 安裝。
          # 測試工具(pytest / PyYAML / ruff)在 requirements-dev.lock,
          # 它由 requirements.lock 編譯而來 —— 所以 CI 跑的執行期版本與
          # production 逐字相同,只是多了測試工具(外審 2026-09-04 P3)。
          pip install --require-hashes -r requirements-dev.lock

      # 全 repo 掃描,不再手寫模組清單(GPT-5.6 review P2:清單曾漏掉
      # render_utils/news_rules/session_calendar 等拆出模組,每次拆檔都要記得更新)
      - name: Syntax check
        run: python -m compileall -q . -x '(\.git|\.venv|__pycache__)'

      - name: Lint
        run: python -m ruff check .

      - name: Run unit tests
        run: python -m pytest -q --junitxml=pytest-report.xml

      # **CI 紅了要看得見為什麼**:job log 要 repo admin 才讀得到,而
      # annotation 是公開的。2026-09-04 我碰到連三個 commit 紅、唯一讀得到
      # 的訊息是「Process completed with exit code 2」,於是只能用猜的。
      # 這一步自己永遠 exit 0 —— 診斷工具不該有能力改變 job 的結論。
      - name: 把 pytest 的失敗轉成 annotation
        if: ${{ always() }}
        run: python tools/ci_pytest_annotations.py pytest-report.xml

  # 手動觸發：用真實資料跑一次完整流程（不寄信），產出 HTML 預覽 artifact。
  # 連 Yahoo / TWSE / LLM，可能因外部服務不穩而失敗 —— 故設 continue-on-error，
  # 不影響 CI 綠燈，也不影響每日排程。
  #
  # 外審 P2-1:**這個 job 的設定必須與排程班一致**,否則它證明的是另一條路。
  # 先前 model 預設 v4-pro、effort 預設 high、`LLM_EVENT_EXTRACTION=0` ——
  # 而生產是 flash / max / 抽取器開啟、走特化結構化路徑。
  # 「canary 綠」在那個設定下不代表生產跑得起來,那正是這個 repo 反覆遇到的
  # 「測試全綠、生產零產出」的形狀。
  #
  # timeout 12 → 30 分鐘:max 推理下單次呼叫實測 81–313 秒,
  # 而總預算是 1200 秒(兩輪特化 + legacy 備援)—— 12 分鐘裝不下,
  # canary 會在證明任何事之前先被 job timeout 砍掉。
  dry-run-preview:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 50   # 第三十一輪外審 P2-5:要 > 應用自己的預算+安裝/上傳邊際(2026-08-27 隨 2700s 放寬)
    # **這個 job 不容忍任何失敗**(第三輪外審 F1)。
    #
    # 我前兩版都在替 `continue-on-error` 辯護,理由是「連外部服務,
    # 變成硬閘門會訓練人忽略紅燈」。第二版改成只容忍 `run` 那一步、
    # 斷言步驟跳過 —— 而那正是外審指出的:**把「沒有 acceptance 證據」
    # 轉換成 success**。import error、中途 crash、寫 manifest 之前掛掉,
    # 全都會讓 job 綠著結束而什麼都沒證明。
    #
    # 那個顧慮之所以站不住,是因為**這個 job 只在 workflow_dispatch
    # 手動觸發時跑**(見上面的 `if:`)—— 它不在每次 push 的路徑上,
    # 紅燈不會變成日常噪音;而按下按鈕的人要的正是「到底成不成」。
    # 沒有證據就是沒有通過。
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          # 批#35 r2(Codex):**不**升級 pip——未鎖版 pip 會被下載並立即執行,
          # 而本 job 持有寫入權限/金鑰;runner 內建 pip 已足以做 --require-hashes 安裝。
          pip install -r requirements.lock

      # **舊 manifest 必須先消失**(外審 P1-2):`state/run_manifest.json`
      # 是進版控的,checkout 之後就在那裡 —— 主流程若在寫它之前掛掉,
      # 斷言會讀到上一班的檔案,而上一班可能剛好健康。
      # 這是**帶** —— 真正的**褲腰帶**是下面斷言步驟的 SHA/run-id 綁定
      # (rm 會被忘記,綁定是舊檔案永遠滿足不了的條件)。
      - name: Remove the checked-in manifest so a stale one cannot pass
        run: rm -f state/run_manifest.json

      # **同一個 nonce 交給生產與斷言**(外審 P2-5):自己隨機產生的話,
      # 斷言只驗得了「非空」—— 那只是一個存在性欄位,證明不了這份
      # manifest 是這一次 process invocation 寫的。
      - name: Mint this invocation's nonce
        id: nonce
        run: echo "value=${{ github.run_id }}-${{ github.run_attempt }}-$RANDOM$RANDOM" >> "$GITHUB_OUTPUT"

      - name: Run morning report (DRY_RUN, no email)
        id: run
        env:
          DRY_RUN: "1"
          RUN_NONCE: ${{ steps.nonce.outputs.value }}
          # 以下各項**與 morning-report-b.yml 逐字相同** —— canary 的價值
          # 全部來自「跑的是同一條路」(外審 P2-1;2026-08-19 第三輪 P2-4:
          # EXTRACTOR_PROVIDER/抽取器模型/timeout 也要鏡射 —— repo variable
          # 設了 EXTRACTOR_PROVIDER=gemini 時,少了這一項的 canary 跑的是
          # deepseek 抽取器,綠燈證明不了生產那條路)。
          LLM_EVENT_EXTRACTION: "1"
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'deepseek' }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # 與生產一致(2026-08-15 主分析改回 v4-flash)—— 驗收關跑的
          # 要是生產真的會跑的那個模型。
          DEEPSEEK_MODEL: deepseek-v4-flash
          DEEPSEEK_EXTRACTOR_MODEL: deepseek-v4-flash
          DEEPSEEK_REASONING_EFFORT: ${{ vars.DEEPSEEK_REASONING_EFFORT || 'max' }}
          EXTRACTOR_PROVIDER: ${{ vars.EXTRACTOR_PROVIDER || '' }}
          LLM_TOTAL_TIMEOUT_SECONDS: ${{ vars.LLM_TOTAL_TIMEOUT_SECONDS }}
          LLM_REQUEST_TIMEOUT_SECONDS: ${{ vars.LLM_REQUEST_TIMEOUT_SECONDS }}
          GEMINI_MODEL: gemini-2.5-flash
          CLAUDE_MODEL: claude-sonnet-4-6
          # 空字串 = 依 provider 自動選(deepseek → 特化結構化路徑),
          # 與排程班同一個逃生門語意。
          LLM_PRIMARY_PROMPT_PROFILE: ${{ vars.LLM_PRIMARY_PROMPT_PROFILE || '' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # canary 也要拿得到每一家**合法 provider** 的金鑰(2026-08-24 外審
          # P2):`LLM_PROVIDER` 在這裡跟著 repo variable 走,使用者把它設成
          # openai 時,少了這一把的 canary 跑的是「沒有金鑰的 openai」——
          # 它會紅,但紅的原因與生產無關;或更糟,退回備援而綠得毫無意義。
          # 生產 workflow 2026-08-22 才修過同一個洞。契約由
          # `tests/test_workflow_contract.py` 用 `PROVIDER_KEY_ENV` 雙向盯著。
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          TZ: Asia/Taipei
        run: python morning_report.py

      # **「跑完了、exit 0」證明不了什麼**:降級成 legacy、兩階段抓取
      # 整段 no-op、昨日觀點沒存下來 —— 三者都會 exit 0。canary 的綠燈
      # 必須代表「特化路徑真的走完了」,否則它只是一個很貴的 smoke test。
      # 判準與每日看門狗**同一份**(`run_quality.assess`)—— 兩份判準
      # 各自演化的話,「canary 綠而生產壞」會再發生一次。
      - name: Assert the run actually produced the specialized output
        # **一律驗**:主流程掛掉時沒有 manifest,斷言會說「跑完了但沒有
        # run_manifest.json」並 exit 1 —— 那是對的結論,而不是「跳過」。
        # 沒有證據就是沒有通過(第三輪外審 F1)。
        if: always()
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          RUN_NONCE: ${{ steps.nonce.outputs.value }}
        # **strict**:這個 job 的名字是「證明特化輸出真的產生了」,
        # 所以退回 legacy 就是不通過(每日生產的 watchdog 用 watchdog 模式,
        # 額度用罄那幾天不該天天當成程式缺陷)。
        run: python tools/assert_run_quality.py --mode strict

      - name: Upload HTML preview
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: morning-report-preview
          path: /tmp/morning_report_preview.html
          if-no-files-found: warn
