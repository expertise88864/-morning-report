# DeepSeek 線上契約金絲雀(2026-08-09 P2)。
#
# 離線的契約測試釘的是 2026-08-08 的實機 fixture —— 它守得住「我們的
# adapter 有沒有被改壞」,守不住「provider 有沒有換契約」。而後者的第一個
# 徵兆會是**某天早上的信壞掉**,在使用者手上,而不是在 CI 裡。
#
# 每週一次、一個最小請求(effort=minimal、max_output_tokens=64)——
# 只問形狀,不問模型答得好不好。與 production 完全隔離,失敗不影響晨報。
#
# 退出碼的意思(見 tools/deepseek_live_canary.py):
#   0 = 形狀符合;1 = **契約變了**(去改 adapter);
#   2 = 跑不起來(沒有金鑰/網路/服務忙碌)—— 那不是契約問題,不該讓人去改程式。
name: deepseek-canary
on:
  schedule:
    - cron: "30 21 * * 1"   # 週二 05:30 台北(避開晨報與 deps-canary)
  workflow_dispatch:
permissions:
  # 狀態檔要 commit 回 repo —— **cache 對「一週一班」是錯的儲存**
  # (GitHub 七天未用就清掉,而我們的間隔正好是七天;外審第二輪 F3:
  # 一直沒命中的話,每一班都以為自己是第一次,永遠綠燈)。
  # repo 是這個 job 唯一拿得到的持久層,而它是可驗證的:
  # checkout 一定會把它帶回來,所以「檔案不在」只可能是還沒 bootstrap。
  contents: write
concurrency:
  group: deepseek-canary
  cancel-in-progress: true
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4(與其他 workflow 同 pin)
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.lock
      # **連續次數要活過 job**(外審 P2-3):沒有它的話,secret 被刪掉之後
      # 每週 RC=2、每週綠燈,而契約從那時起就沒有被監測過。
      - name: Check the live contract
        id: canary
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set +e
          python tools/deepseek_live_canary.py             --state state/deepseek_canary.json --now "$(date -u +%F)"
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # **「跑不起來」不該染紅這個 job**:沒有金鑰、服務忙碌、網路不通
          # 都不是契約問題,而讓它們紅會把真正的契約變更淹沒在噪音裡。
          # 契約真的變了(1)才失敗。
          # 契約真的變了(1)、**或狀態層壞掉(3)**才失敗 —— 後者代表
          # 升級政策失效,而那正是這個 job 要關掉的「永遠綠燈」。
          if [ "$code" = "1" ] || [ "$code" = "3" ]; then exit 1; fi
          exit 0
      # 狀態要留給下一班 —— 這是「多久沒驗證過」唯一的依據。
      - name: Persist the canary state
        if: always()
        run: |
          if ! git diff --quiet -- state/deepseek_canary.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state/deepseek_canary.json
            git commit -m "chore: deepseek canary state [skip ci]"
            git push
          fi

      - name: Say when the check could not run
        if: steps.canary.outputs.code == '2'
        run: |
          echo "::warning::金絲雀這次跑不起來(沒有金鑰/服務忙碌/網路)——"\
               "**不是契約變了**;連續多週出現才需要查。"
