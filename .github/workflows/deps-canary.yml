# 依賴金絲雀(批#24):每週一以「requirements.txt 最新允許版本」跑完整測試——
# production 全面鎖版(requirements.lock)後,新版相容性由本 job 提前發現;
# 紅燈=該升級 lock 前先修相容性。與 production 完全隔離,失敗不影響晨報。
name: deps-canary
on:
  schedule:
    - cron: "0 21 * * 0"   # 週一 05:00 台北
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deps-canary
  cancel-in-progress: true
jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4(與其他 workflow 同 pin)
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install latest allowed deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip list
      - name: Compile + tests
        run: |
          python -m compileall -q .
          python -m pytest tests/ -q
