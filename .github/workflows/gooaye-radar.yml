name: Gooaye Radar

# 股癌雷達:獨立於晨報。股癌固定週三/週六下午約 14:00–16:30 台北上架 →
# 本 workflow 在週三/週六下午~晚上多時段偵測新集 → 轉錄 → LLM 萃取族群+立場 →
# 看多族群混合驗證展開台股個股 + 籌碼/基本面/動能/新聞 → 寄獨立信。
# 偵測不到新集即秒退不寄;以 state/gooaye_radar.json 的 guid 去重,同一集只寄一次。
# 個股為本報依族群自動整理、非股癌推薦、非投資建議。
on:
  # 2026-06-22 停用自動排程:回測顯示股癌題材對 0050 無穩定 alpha(多為「已先漲才被提及」),
  #   故不再寄獨立股癌信;股癌觀點仍透過 podcast_digest 併入每日晨報。
  #   保留 workflow_dispatch,需要時仍可手動跑。要恢復自動寄信,取消下方 schedule 註解即可。
  # schedule:
  #   - cron: "0 6,8,10,12,14 * * 3,6"   # 台北 週三/週六 14:00/16:00/18:00/20:00/22:00
  workflow_dispatch:   # 手動觸發(可搭配 DRY_RUN 不寄信)

permissions:
  contents: write   # push 回 state/gooaye_radar.json(及 podcast_digest.json 去重標記)

concurrency:
  group: gooaye-radar
  cancel-in-progress: false   # 勿中途取消:寄信後若被新一輪 cron 取消、來不及 push state 會重複寄

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 110   # 股癌約 50 分、medium 模型轉錄較慢
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Cache whisper models
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: ~/.cache/huggingface
          key: faster-whisper-small-medium-v1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 批#35:改用鎖版+hash。本 job 是全 repo 最敏感的一組 env
          # (GMAIL_APP_PASSWORD 可用本人身分寄信 + DEEPSEEK_API_KEY + FINMIND_TOKEN
          #  + contents: write),而 gooaye_radar.py 會 `import morning_report`
          # 直接載入生產主程式。原本 `-r requirements.txt`(全是 >= 下限)加上
          # 未鎖版 faster-whisper,每次執行都解析到當下最新版 → 供應鏈完全不設防。
          # 用**合併編譯**的單一 lock:兩份 lock 各自解析會釘出不同的共用套件版本
          # (實測 certifi 2026.6.17 vs 2026.7.22),hash-checking 模式不接受同一
          # 套件兩個版本 → 安裝會直接失敗。requirements-radar.lock 由
          # requirements-radar.in(= requirements.txt + faster-whisper)一次解出。
          pip install -r requirements-radar.lock

      - name: Prefetch whisper model (medium, 股癌 high-accuracy)
        run: |
          python -c "from faster_whisper import WhisperModel; WhisperModel('medium', device='cpu', compute_type='int8')"

      - name: Run Gooaye radar
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT: ${{ vars.RECIPIENT || secrets.RECIPIENT }}
          # 留空 RADAR_RECIPIENT → 與晨報同一批收件者
          RADAR_RECIPIENT: ${{ vars.RADAR_RECIPIENT || secrets.RADAR_RECIPIENT }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: https://api.deepseek.com
          # 選填:設了 FINMIND_TOKEN(免費註冊)可拉高外資持股查詢額度;留空則用免 token 免費額度
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          PODCAST_WHISPER_MODEL_HIGH: medium
          TZ: Asia/Taipei
        run: python gooaye_radar.py

      - name: Commit & push state
        if: always()
        run: |
          git config user.name "morning-report-bot"
          git config user.email "actions@github.com"
          # 只 push 雷達自有 state;不碰 podcast_digest.json(去重由晨報讀本檔 radar_sent_at 達成,避免競寫)
          git add state/gooaye_radar.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: update gooaye radar state [skip ci]"
            git pull --rebase --autostash
            git push
          else
            echo "no state changes"
          fi
