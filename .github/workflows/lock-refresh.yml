name: Lock Refresh

# 批#35:生產鎖版清單的**自動更新入口**。
# 起因:dependabot.yml 的 pip ecosystem 指向 requirements.txt(全是 >= 下限),
# 而 production 實際安裝的是 requirements*.lock —— Dependabot 不把 .lock 當作
# 可辨識的 manifest,且既有 >= 範圍已涵蓋新版,幾乎不會開 PR。
# 淨效果:真正跑在 production 的鎖版清單,既收不到版本更新 PR、也收不到安全更新通知。
# 這支每月重跑 uv pip compile 並開 PR,由人審後合併(仍走 Codex 閘門)。

on:
  schedule:
    - cron: "0 3 1 * *"   # 每月 1 日 UTC 03:00(台北 11:00)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: lock-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Recompile locks
        run: |
          set -euo pipefail
          COMMON="--python-version 3.11 --python-platform x86_64-unknown-linux-gnu --generate-hashes"
          uv pip compile requirements.txt          $COMMON -o requirements.lock
          uv pip compile requirements-podcast.in   $COMMON -o requirements-podcast.lock
          uv pip compile requirements-radar.in     $COMMON -o requirements-radar.lock

      - name: Open PR if changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet -- requirements.lock requirements-podcast.lock requirements-radar.lock; then
            echo "[lock-refresh] 無更新"
            exit 0
          fi
          BRANCH="chore/lock-refresh-$(date -u +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add requirements.lock requirements-podcast.lock requirements-radar.lock
          git commit -m "chore(deps): 每月重編譯依賴 lock(含 hash)"
          git push -u origin "$BRANCH"
          gh pr create --title "chore(deps): 每月 lock 重編譯" \
            --body "自動重跑 uv pip compile --generate-hashes。**合併前請確認 CI 綠**,並依 CLAUDE.md 走 Codex 閘門。" \
            --base main --head "$BRANCH"
