name: Lock Refresh

# 批#35:生產鎖版清單的**自動更新入口**。
# 起因:dependabot.yml 的 pip ecosystem 指向 requirements.txt(全是 >= 下限),
# 而 production 實際安裝的是 requirements*.lock —— Dependabot 不把 .lock 當作
# 可辨識的 manifest,且既有 >= 範圍已涵蓋新版,幾乎不會開 PR。
# 淨效果:真正跑在 production 的鎖版清單,既收不到版本更新 PR、也收不到安全更新通知。
#
# Codex 三輪修正後的結構:
#  F1 建置工具本身鎖版+hash(requirements-uvtool.lock);不升級 pip(未鎖版 pip
#     會被下載並立即執行)。
#  F2 由 GITHUB_TOKEN 建立的 PR **不會觸發** ci.yml(GitHub 迴圈防護)→ 驗證改在
#     workflow 內自己做,不承諾「合併前看 CI」。
#  F3 分支名加 run_id,避免同日重跑撞既有遠端分支。
#  r3 **權限隔離(關鍵)**:執行「新解析出來的依賴」與「持有寫入 token 做 push」
#     必須分屬不同 job。被投毒的套件在 import 時即可裝 git hook 或改 GITHUB_PATH,
#     若同 job 稍後拿到 GH_TOKEN,persist-credentials: false 也擋不住。
#  2026-09-04 外審 P2(兩輪):權限分離之後,**產物的完整性**還沒分離 ——
#     舊結構是同一個 job「compile → 安裝並跑測試 → upload」,被投毒的依賴跑在
#     同一個可寫工作區,可以就地改寫 lock(第一版補的 sha256 指紋也擋不住:
#     指紋檔與被檢查的檔在同一個信任邊界,而且核對與 upload 之間仍有空窗)。
#     三段式才閉合:resolve 只跑 uv、**先上傳** candidate → verify 下載後才安裝
#     並執行新依賴(權限只有 contents: read,動不到已上傳的 artifact,也不上傳)
#     → open-pr 只在 verify 成功後跑,下載的是 resolve 那一份。

on:
  schedule:
    - cron: "0 3 1 * *"   # 每月 1 日 UTC 03:00(台北 11:00)
  workflow_dispatch:

# 預設最小權限;需要寫入的只有 open-pr job(於該 job 內宣告)
permissions:
  contents: read

concurrency:
  group: lock-refresh
  cancel-in-progress: false

jobs:
  # ── A. 解析並**立刻**交棒(這個 job 不執行任何新解析的依賴)────────────
  #
  # 2026-09-04 外審 P2 第二輪:上一版是「compile → 指紋 → 安裝並跑 pytest →
  # 核對指紋 → upload」,而**指紋檔與待上傳的檔案都在同一個可寫工作區**:
  # 被投毒的依賴可以連 `/tmp/locks.sha` 一起改,或留一個背景行程在核對之後、
  # upload 讀檔之前再動手。檢查與被檢查的東西同屬一個信任邊界時,檢查證明不了
  # 完整性。改成三段:
  #   A resolve  只跑 uv compile(uv 自己是鎖版+hash 的),**先上傳** candidate;
  #   B verify   下載 candidate → 安裝並跑測試(新依賴在這裡執行);它沒有
  #              `actions: write`,動不到 A 已上傳的 artifact,也不上傳任何東西;
  #   C open-pr  只有 B 成功才跑,下載的是 **A 那一份**,commit、開 PR。
  # artifact 上傳後不可覆寫(upload-artifact v4+),而 B 的權限只有 contents: read
  # —— 所以 C 拿到的位元組必然等於 A 編譯出來的那一份。
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"

      - name: Install uv (pinned + hashed)
        run: |
          # 不升級 pip:未鎖版 pip 會被下載並立即執行;runner 內建 pip 已足以
          # 做 --require-hashes 安裝。
          pip install --require-hashes -r requirements-uvtool.lock

      - name: Recompile locks
        run: |
          set -euo pipefail
          COMMON="--python-version 3.11 --python-platform x86_64-unknown-linux-gnu --generate-hashes"
          uv pip compile requirements.txt          $COMMON -o requirements.lock
          # **必須排在主 lock 之後,而且要帶 `-c requirements.lock`**:
          # 共用套件的版本因此被生產 lock 釘死 —— CI 跑的是 production 真正
          # 裝的那些版本,而這件事是編譯出來的結果,不是要靠人對齊的約定
          # (外審 2026-09-04 P3)。dev 來源檔本身引的是 requirements.txt,
          # 這樣它在 Windows 本機也 `pip install` 得起來(lock 的 hash 只
          # 涵蓋 Linux wheel)。
          uv pip compile requirements-dev.txt -c requirements.lock \
                                                   $COMMON -o requirements-dev.lock
          uv pip compile requirements-podcast.in   $COMMON -o requirements-podcast.lock
          uv pip compile requirements-radar.in     $COMMON -o requirements-radar.lock
          uv pip compile requirements-uvtool.in    $COMMON -o requirements-uvtool.lock

      - name: Detect changes
        id: diff
        run: |
          set -euo pipefail
          if git diff --quiet -- requirements.lock requirements-dev.lock \
                                 requirements-podcast.lock \
                                 requirements-radar.lock requirements-uvtool.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "[lock-refresh] 無更新"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # **在執行任何新依賴之前上傳**:這一段是整個信任邊界的關鍵。
      # 此 job 到目前為止只跑過 `uv`(它自己是鎖版+hash 安裝的),沒有執行過
      # 任何新解析出來的套件 —— 所以這份 artifact 的內容就是編譯器的輸出。
      - name: Upload candidate locks (before any new dependency runs)
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: refreshed-locks
          path: |
            requirements.lock
            requirements-dev.lock
            requirements-podcast.lock
            requirements-radar.lock
            requirements-uvtool.lock
          retention-days: 7

  # ── B. 驗證(新依賴在這裡執行;它動不到 A 的 artifact,也不上傳任何東西)──
  verify:
    needs: resolve
    if: needs.resolve.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45   # 含三份 lock 的實裝驗證(faster-whisper 相依較大)
    permissions:
      contents: read      # **沒有 actions: write** —— 改不了、刪不了 A 上傳的 artifact
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"

      # 驗的是 A 交棒的那一份,不是工作區裡 checkout 出來的舊 lock
      - name: Download candidate locks
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: refreshed-locks

      # 在唯讀 job 內驗證(不依賴 PR 觸發 CI);新依賴的 import-time 程式碼在此執行,
      # 但本 job 沒有任何寫入權限與 token,即使被投毒也拿不到東西 ——
      # **而且它在這裡對工作區做的任何修改都不會流到 open-pr**(C 重新下載 A 的 artifact)。
      - name: Verify locks install & tests pass
        run: |
          set -euo pipefail
          python -m venv /tmp/venv-main
          # 裝 dev lock:pytest 已經不在生產 lock 裡了,而它的執行期版本
          # 與生產 lock 逐字相同 —— 這裡驗到的仍然是 production 會裝的東西。
          /tmp/venv-main/bin/pip install --require-hashes -r requirements-dev.lock
          /tmp/venv-main/bin/python -m pytest -q
          # 生產 lock 本身也要能獨立裝起來、而且晨報真的 import 得動 ——
          # 少了這一步,「生產 lock 漏掉某個執行期套件」要到隔天早上才知道。
          python -m venv /tmp/venv-prod
          /tmp/venv-prod/bin/pip install --require-hashes -r requirements.lock
          /tmp/venv-prod/bin/python -c "import morning_report"
          python -m venv /tmp/venv-podcast
          /tmp/venv-podcast/bin/pip install --require-hashes -r requirements-podcast.lock
          /tmp/venv-podcast/bin/python -c "import faster_whisper, feedparser, requests"
          python -m venv /tmp/venv-radar
          /tmp/venv-radar/bin/pip install --require-hashes -r requirements-radar.lock
          /tmp/venv-radar/bin/python -c "import faster_whisper, yfinance, pandas"

  # ── C. 開 PR(乾淨 runner;拿的是 A 那一份,而且只在 B 成功後才跑)────────
  open-pr:
    needs: [resolve, verify]
    if: needs.resolve.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      # 乾淨 runner:只取 repo 與 artifact,**不安裝也不執行任何新解析的依賴**
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Download refreshed locks
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: refreshed-locks

      - name: Open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH="chore/lock-refresh-$(date -u +%Y%m%d)-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add requirements.lock requirements-dev.lock requirements-podcast.lock \
                  requirements-radar.lock requirements-uvtool.lock
          git commit -m "chore(deps): 每月重編譯依賴 lock(含 hash)"
          git push -u origin "$BRANCH"
          BODY=$(printf '%s\n' \
            '自動重跑 uv pip compile --generate-hashes(uv 本身亦鎖版+hash)。' \
            '' \
            '已在唯讀 job 內驗證(GITHUB_TOKEN 建立的 PR 不會觸發 ci.yml,故不依賴它):' \
            '- 每一份 lock 皆以 --require-hashes 實際安裝成功' \
            '- dev lock 環境跑過完整 pytest;生產 lock 另外單獨裝起來並 import morning_report' \
            '- podcast / radar 環境通過 import 冒煙測試' \
            '' \
            '本 job 未執行任何新解析的依賴(權限隔離)。合併前仍請依 CLAUDE.md 走 Codex 閘門。')
          gh pr create --title "chore(deps): 每月 lock 重編譯" \
            --body "$BODY" --base main --head "$BRANCH"
