name: Monthly IC Report

# 每月產出因子 IC / 計分方案回測報告(讀 repo 內 state/model_history.json,純離線、不寄信)。
# 目的:讓使用者不用等 session,自己就能看因子成熟度;累積夠月數後據此提「權重變更提案」。
on:
  schedule:
    - cron: "0 2 1 * *"   # 每月 1 日 02:00 UTC(台北 10:00)
  workflow_dispatch:

permissions:
  contents: write   # push 回 backtest_data/reports/YYYY-MM.md

# 批#23(五審 P2):與 morning/podcast 共用 state-writers group——月報也
# push main,不同 group 會與 09:30 podcast(最長 95 分)競態
concurrency:
  group: state-writers
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      # bt_factor_ic / bt_radar_score / monthly_report 皆純標準庫,無需安裝依賴。
      - name: Generate IC report
        run: python backtest_data/monthly_report.py

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backtest_data/reports/*.md || true
          git commit -m "chore(report): 月度因子 IC 報告 [skip ci]" || { echo "no changes to commit"; exit 0; }
          # push 失敗不得吞掉保持綠燈(五審 P2):fetch/rebase 重試三次,仍敗即紅
          for i in 1 2 3; do
            git push && exit 0
            git fetch origin main && git rebase origin/main || exit 1
          done
          echo "push failed after retries" >&2
          exit 1
