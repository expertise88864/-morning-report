# 檔名的 `-a` 是 2026-08-29 的排程急救:08/26 起本檔與看門狗的 cron 連三天
# 完全沒有建立 run(touch 與 disable/enable 都救不回,podcast 正常)——
# GitHub 端的排程註冊死透了,改檔名讓它被當成**全新的 workflow** 重建註冊。
# 舊 run 歷史掛在舊檔名下。若再改名,記得同步 watchdog 的 API URL 與測試。
name: Morning Report

on:
  schedule:
    # 台灣時間 06:00 = UTC 22:00 (前一日)
    # GitHub Actions 排程通常延遲 5-15 分鐘，故實際收信約 06:05-06:20
    # 週日 22:00 UTC → 週一 06:00 TPE   (週末綜合報)
    # 週一 22:00 UTC → 週二 06:00 TPE   (報週一晚的美股)
    # 週二 22:00 UTC → 週三 06:00 TPE
    # 週三 22:00 UTC → 週四 06:00 TPE
    # 週四 22:00 UTC → 週五 06:00 TPE
    # 週五 22:00 UTC → 週六 06:00 TPE   (報週五晚收盤)
    # 週六 22:00 UTC → 週日 06:00 TPE   (週日綜合輕量信:有新體育/Podcast/政策/醫界才寄)
    #
    # **兩個觸發點,不是一個**(2026-08-27 生產:`0 22 * * *` 那一輪
    # GitHub **完全沒有建立** —— 不是失敗,是不存在;而看門狗自己也是
    # 排程、同樣沒跑,所以連通知都沒有)。GitHub 不保證排程一定觸發,
    # 整點又是最壅塞的一分鐘(過去幾天實際啟動都是 22:08~22:12)。
    #
    # 移離整點降低被丟棄的機率;第二個觸發點負責補漏跑。
    # **重複寄信由程式擋**(`morning_report.already_delivered_today`):
    # 同一天已經寄成功/刻意跳過就直接結束,而且只擋 `schedule` ——
    # 手動觸發永遠跑得動(那是使用者的救援管道)。
    # 兩班共用同一個 concurrency group,所以第二班會排隊等第一班寫完
    # state 才開始,讀得到最新的 manifest。
    # 2026-08-28:08/26 起連四個觸發點 GitHub 完全沒有建立 run(看門狗的
    # 23:45Z 同樣全滅,podcast 的四班照常)—— workflow 檔在第一次失蹤前
    # 零變更,這是 GitHub 端排程註冊卡死的已知長尾問題;push 一次
    # workflow 檔變更可強制重新註冊。此註解就是那次 touch。
    # **2026-08-31 使用者定案 SLA:信可以晚到,但台北 09:00(台股開盤)
    # 前必須到。** GitHub 排程的延遲是「觸發點之後」才開始算的 ——
    # 08/30、08/31 連兩天實測延遲 2 小時 8 分~2 小時 23 分,06:07 的主班
    # 拖到 08:30 才開跑,平日班再跑半小時就貼著 09:00。repo 端買不到
    # 延遲上限,能買的是**起點**:整組觸發點前移一小時、加一班,
    # 最壞情境(單班延遲 2.5 小時)仍在 08:10 前寄達。
    # 正常日子信會提早到約 05:15~05:45;資料面安全:美股 04:00 收、
    # 台指期夜盤 05:00 收、podcast 最後一抓 03:30,全部在 05:07 之前。
    # 多一班不會多寄:同日冪等(三來源+收據)08/30 已實戰驗證。
    - cron: "7 21 * * *"    # 05:07 TPE — 主要
    - cron: "52 21 * * *"   # 05:52 TPE — 補漏跑一(已寄過就空轉結束)
    - cron: "42 22 * * *"   # 06:42 TPE — 補漏跑二(同上)
  workflow_dispatch:   # 允許手動觸發測試
    inputs:
      rescue:
        description: >-
          看門狗的自動補寄(會套用同日冪等:今天已經寄成功就不重複寄)。
          人工補寄請保持 false —— 那是使用者明知寄過了仍要再寄的救援管道。
        type: boolean
        default: false

permissions:
  contents: write   # 允許 push 回 state/history.json

# 所有會寫 state 的高頻 workflow(morning/podcast)共用單一 group、一律不取消:
# 誰先到誰先跑,其餘排隊序列化。前版「排程/手動分 group」只解決互相取消,
# 但兩者可同時跑=同時寄信+同時 push state(GPT-5.6 四審 P1-6);morning 與
# podcast 也都寫 state/podcast_digest.json,必須互斥。卡死由 timeout-minutes 兜底。
#
# 批#32 評估後**維持共用 group**(不改):morning 與 podcast 都寫
# state/podcast_digest.json,互斥是刻意設計、載重中。改成獨立 group 雖可免除
# 「排隊中被第三個 run 擠掉」的風險,但會換來兩者並行寫同一份 state 的資料競爭,
# 不划算。殘留風險(pending 被取消時 job 未啟動、告警步驟也不會執行)已知,
# 需要獨立 watchdog 才能覆蓋——留待使用者定案,見 review 報告。
concurrency:
  group: state-writers
  cancel-in-progress: false

jobs:
  send-report:
    runs-on: ubuntu-latest
    # 批#101:25 → 40 分。cron 是 05:07 台北(2026-08-31 前移),台股 09:00 開盤 ——
    # 牆鐘餘裕有兩小時,真正的限制從來不是時間而是這三個數字沒有綁在一起:
    # job timeout > RUN_BUDGET_SECONDS > LLM 預算。放寬是為了讓高推理強度
    # 不必用「跳過新聞全文擷取」去換(那等於拿信的深度換推理深度)。
    # 這不是把寄信拿去賭:RUN_BUDGET_SECONDS 仍然保證信會先寄出,
    # job timeout 只是最後的兜底。
    # 2026-08-27:40 → 50(LLM 總預算 1800s + run 預算 2700s 的連動;
    # 最壞情況信 ~06:55 寄達,正常日子不受影響)。
    timeout-minutes: 50
    # 批#93(第九輪 P1-10):**「信沒寄出」與「信寄出了但事後檢查失敗」是兩件事。**
    # 2026-07-31 就發生過:信正常寄達,而寄信**之後**的 state schema 契約失敗
    # 讓 job 變紅 → 告警信說「晨報未寄出,收件人可能沒有收到信」。
    # 誤報比沒有告警更糟:它訓練收件人忽略告警,而下一次是真的沒寄出。
    # 由晨報自己在寄信成功後寫這個 output(見 `_gha_output`),不靠步驟的成敗推測。
    outputs:
      delivered: ${{ steps.report.outputs.delivered }}
      # **品質結果要有消費端才算數**(2026-08-31 r1 外審):第一版只加了
      # 自評步驟、`continue-on-error: true`,而註解卻宣稱「結果寫進 output
      # 由獨立 job 判讀」—— 那個 output 與那個 job 都不存在。判準會跑、
      # 會印 annotation,然後**沒有任何人收到通知**。
      quality_alertable: ${{ steps.quality.outputs.alertable }}
      quality_detail: ${{ steps.quality.outputs.summary }}
      # **判準自己壞掉也要有人收到**(2026-09-01 r3 外審):品質自評是
      # `continue-on-error`,所以它失敗時 job 仍是綠的 → alert-on-failure
      # 不啟動;而輸出寫不進去時 `alertable` 缺席 → alert-on-quality 也不
      # 啟動。結果是 Actions UI 有紅色 step,卻沒有任何一封信。
      # `outcome` 保留 continue-on-error **之前**的原始結果,正是這裡要的。
      quality_step_outcome: ${{ steps.quality.outcome }}
      # 判準**跑完了**的標記。它對任何 defect 刻意 exit 1(退出碼服務
      # CI),所以 outcome=failure 不代表判準壞了 —— 兩者要分開問。
      quality_assessed: ${{ steps.quality.outputs.assessed }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0    # 完整歷史，避免 push 衝突

      # **備援班的同日冪等證據**(r2 外審 P1)。排程觸發的 checkout 檢出的是
      # 「排程事件建立當時」的 commit:備援班在佇列裡等主班寫完 state,拿到
      # runner 之後工作區**仍停在等待前的舊快照** —— 只讀工作區的話,主班剛
      # 寄成功的那份證據看不到,於是再寄一封。信寄出去收不回來。
      # 這一步跑在取得 concurrency 名額**之後**(整個 job 都是),所以這裡讀到
      # 的 origin/main 是當下的。讀不到就不產生檔案 → 守衛 fail-open 照跑。
      - name: 讀取 origin/main 當下的寄送紀錄
        continue-on-error: true
        run: |
          set +e
          git fetch --quiet origin main || exit 0
          git show FETCH_HEAD:state/run_manifest.json \
            > "$RUNNER_TEMP/fresh_run_manifest.json" 2>/dev/null \
            || rm -f "$RUNNER_TEMP/fresh_run_manifest.json"
          git show FETCH_HEAD:state/delivery_receipt.json \
            > "$RUNNER_TEMP/fresh_delivery_receipt.json" 2>/dev/null \
            || rm -f "$RUNNER_TEMP/fresh_delivery_receipt.json"
          exit 0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          # 批#35 r2(Codex):**不**升級 pip——未鎖版 pip 會被下載並立即執行,
          # 而本 job 持有寫入權限/金鑰;runner 內建 pip 已足以做 --require-hashes 安裝。
          pip install -r requirements.lock   # 鎖版+hash(批#24):套件無預警升版不再直接進 production

      # 第十三輪 P2-5:**真正的執行開始時間。**
      # 先前用 `_experiment_row()` 呼叫當下的時間當 `started_at`,而那是
      # LLM 分析跑完(或失敗)之後 —— 兩個 workflow 重疊時,「先開始、後完成」
      # 與「後開始、先完成」的順序會相反,而重跑偏差正是靠先後判的。
      - name: 記下執行開始時間
        run: echo "RUN_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%S+00:00)" >> "$GITHUB_ENV"

      - name: Run morning report
        env:
          # origin/main 當下的寄送紀錄(上面那一步寫的;沒寫成就不存在 →
          # 守衛 fail-open 照跑)。備援班的同日冪等靠它,見 r2 外審 P1。
          FRESH_RUN_MANIFEST: ${{ runner.temp }}/fresh_run_manifest.json
          # 寄送收據:SMTP 成功當下就發佈,不等整批 state 的 schema 契約。
          # 「已經寄出但 state 沒發佈成功」時只有它答得出來(r3 外審 P1)。
          FRESH_DELIVERY_RECEIPT: ${{ runner.temp }}/fresh_delivery_receipt.json
          # 這一班是不是看門狗的自動補寄。是的話**同日冪等照樣適用** ——
          # 補寄班要等排隊才執行,那之間主班可能已經寄成功(r9 外審 P1)。
          RESCUE_RUN: ${{ inputs.rescue }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          # 收件者可設在 GitHub Variables（vars）或 Secrets；支援多位，以逗號分隔。
          RECIPIENT: ${{ secrets.RECIPIENT }}

          # ===== LLM 切換 =====
          # 可選值：
          #   "deepseek"  → DeepSeek V3.2/V4（推薦，NT$3/月，中文超強）
          #   "gemini"    → Gemini 2.5 Flash（免費，品質中等）
          #   "anthropic" → Claude Sonnet 4.6（NT$46/月，品質最佳）
          # 主分析 provider:deepseek / openai / gemini / anthropic
          # 改用 repo variable 覆寫(Settings → Variables),不必動 workflow 檔
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'deepseek' }}
          # DeepSeek 的推理強度。官方文件(2026-08-01):v4-pro 的映射是
          # low→high、high→high、xhigh→max、max→max —— 先前一直用的 `high`
          # **其實只到中段**(那時我照的是 repo 裡一行過時的註解,不是文件)。
          # 改用 `max` 取最高推理;仍可由 repo variable 覆寫退回。
          DEEPSEEK_REASONING_EFFORT: ${{ vars.DEEPSEEK_REASONING_EFFORT || 'max' }}
          LLM_EVENT_EXTRACTION: "1"

          # DeepSeek（推薦）— 走 OpenAI 相容 API
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # Macro Vintage(選配):FRED/ALFRED 免費 key,未設則功能休眠
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          # 2026-08-15:主分析改回 **deepseek-v4-flash**(使用者指定)。
          # 08-13~08-15 試跑 pro 的實測:單價約 flash 3 倍、一次嘗試 610 秒
          # (flash 約 1/3),2100 秒預算只夠一輪 → **修補輪被時間預算跳過**,
          # 而修補輪正是特化路徑收斂的關鍵。08-15 那班 DeepSeek 餘額用盡
          # (402)全部走備援。⚠ 2026-08-16 16:00 UTC 起改峰谷計價:
          # 06:00 台北 = 22:00 UTC 屬離峰(flash 離峰 $0.22/$0.66)。
          DEEPSEEK_MODEL: deepseek-v4-flash
          DEEPSEEK_EXTRACTOR_MODEL: deepseek-v4-flash
          DEEPSEEK_BASE_URL: https://api.deepseek.com
          # 思考模式的翻譯規則(開關 vs 強度、別名映射)只寫在
          # `llm_telemetry.deepseek_thinking` —— 這裡不再重複一份會漂移的規格。
          # (第十一輪 P2-2:原本這行寫「high / medium / low;設 off 可關閉」,
          #  而官方文件說思考**預設開啟**、關閉要明確送 disabled。批#118 只改了
          #  morning_report.py 那份,這一份還留著錯的。)
          # 批#97:**這兩行原本寫死 "180" / "75",讓批#93 的時間放大在生產成為死碼。**
          # 程式碼讓明設的環境變數優先(那是對的 —— 要能臨時壓低),但 workflow
          # 一直在明設,於是放大從來沒有發生過。2026-08-01 的後果:GPT-5.6 在
          # 75 秒內跑不完 85,814-token 的 prompt → ReadTimeout → Gemini 也失敗
          # → 使用者收到降級版基本報告。
          # 不設 = 空字串 = 由程式依 provider 與推理強度決定(見 `timeout_base`);
          # 要臨時壓低仍可設 repo variable。
          LLM_TOTAL_TIMEOUT_SECONDS: ${{ vars.LLM_TOTAL_TIMEOUT_SECONDS }}
          LLM_REQUEST_TIMEOUT_SECONDS: ${{ vars.LLM_REQUEST_TIMEOUT_SECONDS }}

          # 事件抽取器 provider(空 = 跟隨 LLM_PROVIDER)
          EXTRACTOR_PROVIDER: ${{ vars.EXTRACTOR_PROVIDER || '' }}
          # 主分析問法(空 = 依 provider 自動選:deepseek → 特化結構化路徑)。
          # **逃生門**:設 repo variable 為 deepseek_legacy_v1 即回舊 prompt,不必 revert。
          LLM_PRIMARY_PROMPT_PROFILE: ${{ vars.LLM_PRIMARY_PROMPT_PROFILE || '' }}
          # 上面每一項都在 YAML 就用 `|| 預設` 補齊,所以程式看到的永遠是最終值,
          # **分辨不出「沒設」與「設成跟預設一樣」**。2026-08-01 就是這樣:
          # 使用者設了 LLM_PROVIDER=openai 卻仍跑 DeepSeek,而 manifest 看不出原因
          # (最可能是設成了 Secrets —— `vars.X` 讀不到 Secret,靜默落回預設)。
          # 這一行把**未經遮蔽的原始值**一起傳進去,由程式指出哪些其實是空的。
          # 刻意進 manifest 而不是只印 job log:job log 要 admin 才讀得到。
          #
          # 第十一輪 P2-1:**原本只帶四個鍵**,於是批#118 把 DeepSeek 預設改成
          # max 之後,manifest 仍答不出「max 是使用者明設,還是 workflow 預設?」。
          # 現在 `llm_telemetry.CONFIG_SOURCE_SPEC` 裡每一個 `variable` 鍵都要在
          # 這裡,並由 `tests/test_workflow_contract.py` **雙向**比對(少一個、
          # 多一個、預設值漂移都會紅)—— 這串不再是人手維護的清單。
          # 值本身都不是機密(模型名/推理強度/逾時秒數),沒有遮蔽問題。
          LLM_CONFIG_RAW: >-
            LLM_PROVIDER=${{ vars.LLM_PROVIDER }};
            EXTRACTOR_PROVIDER=${{ vars.EXTRACTOR_PROVIDER }};
            DEEPSEEK_REASONING_EFFORT=${{ vars.DEEPSEEK_REASONING_EFFORT }};
            LLM_TOTAL_TIMEOUT_SECONDS=${{ vars.LLM_TOTAL_TIMEOUT_SECONDS }};
            LLM_REQUEST_TIMEOUT_SECONDS=${{ vars.LLM_REQUEST_TIMEOUT_SECONDS }};
            LLM_PRIMARY_PROMPT_PROFILE=${{ vars.LLM_PRIMARY_PROMPT_PROFILE }}

          # Gemini（免費備援，可留空）
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash

          # Anthropic Claude（付費高品質，可留空）
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # llm_config.VALID_PROVIDERS 宣告 openai 可用,workflow 卻沒注入它的
          # 金鑰 —— 一個被宣告為合法的設定實際上啟動不了(2026-08-22 外審 P2-6)。
          # 契約由測試盯著:宣告與注入要一致。
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLAUDE_MODEL: claude-sonnet-4-6

          # SEC EDGAR User-Agent 聯絡信箱（選填，不設則自動用 GMAIL_USER）
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}

          # ===== 個人持股今日預估漲幅（選填，隱私：信件只顯示彙總 % + 金額，不揭露明細）=====
          # 格式：JSON {"2330": 5000, "2454": 2000} 或 簡易 2330:5000,2454:2000
          # ⚠ 單位是「股數」不是張（1 張 = 1000 股；零股直接填股數）。
          #   程式端有防呆：單一標的 >1000 萬股視為單位誤填，整組拒用並報錯。
          # 放 Secrets（不是 Variables），避免持股明細出現在 Actions log。
          PORTFOLIO_1: ${{ secrets.PORTFOLIO_1 }}
          PORTFOLIO_2: ${{ secrets.PORTFOLIO_2 }}
          # 倉位顯示名稱（選填，可放 Variables；預設 持倉1 / 持倉2）
          PORTFOLIO_1_NAME: ${{ vars.PORTFOLIO_1_NAME }}
          PORTFOLIO_2_NAME: ${{ vars.PORTFOLIO_2_NAME }}

          TZ: Asia/Taipei
          STATE_PUSH_DEFERRED: "1"
        id: report
        run: python morning_report.py

      # 批#77 r1(Codex,P1):**已落地 state 的 schema 契約需要每日觸發點。**
      # 那組契約原本只由 pytest 跑,而 pytest 只在 push/PR 觸發;
      # 每日的 state commit 帶 `[skip ci]`,所以今天寫壞的 state 要等到下一次
      # 有人 push 程式碼才可能被發現 —— 期間損毀資料會直接餵給後續晨報。
      #
      # 放在寄信**之後**:此時信已寄出,不違反「晨報不可斷」;契約失敗會讓
      # 這個 job 變紅,既有的 alert-on-failure job 會據此發告警信。
      # `continue-on-error: false`(預設)是刻意的 —— 靜默通過的契約等於沒有契約。
      # 第十輪 P1-9:**契約卡在 commit 與 push 之間。**
      # 原本這一步跑在晨報**之後**,而晨報自己已經 push 了 —— schema 壞掉的
      # state 早就在 main 上,契約只能事後告訴你。現在晨報只 commit
      # (`STATE_PUSH_DEFERRED=1`),契約通過才由下一步發佈。
      # 信在此之前就已經寄出,所以這不影響「晨報不可斷」。
      # **沒有 state 變動就不必驗、也不必發佈**(2026-09-01 r2 外審):
      # 備援班 no-op 時 app 約 1 秒就結束,而這條契約實測約 3 分鐘 ——
      # 三班排程裡有兩班每天都是 no-op,那是**常態不是例外**:白跑 runner、
      # 延長 `state-writers` 佔用、增加排隊壓力,而備援本身是可靠性機制。
      - name: 驗證落地 state 的 schema 契約
        if: ${{ always() && !cancelled() && steps.report.outputs.state_dirty == 'true' }}
        env:
          TZ: Asia/Taipei
        run: python -m pytest tests/test_state_schema_contract.py -q

      # **本班自己判品質**(2026-08-31 外審 P1:completion race)。
      # 品質判準先前只由看門狗事後跑,而看門狗可能在主班**還在跑**的時候
      # 啟動 —— 它讀到的 manifest 是舊的,看不到「這班最後 Luna 會失敗」
      # (08/31 正是 20→12→2 到最後才落 legacy)。而晨報自己的
      # alert-on-failure 只看 job 成敗,「信寄了但落回 legacy」在它眼中是
      # 成功。產出者在收尾自己判一次,就沒有「太早來、看不到結果」的競態。
      #
      # `continue-on-error` 是刻意的:品質有瑕疵不等於晨報沒寄出,讓它把
      # job 變紅會使失敗告警誤報「晨報未寄出」。但**不變紅不等於不通知**
      # —— 結果寫成 job output,由下方 `alert-on-quality` 消費。
      # **只對真的產出本班 manifest 的 run 判品質**(2026-09-01 外審 P1):
      # 備援班 no-op 時工作區的 manifest 是 checkout 來的**舊**那份 ——
      # 拿它判會得到沒有意義的綠燈,或對著昨天的缺陷再寄一封「本班品質
      # 異常」,而那封信自己宣稱「由產出者在收尾時判定」是假的。
      #
      # **判準吃結構化 output,不吃退出碼**:退出碼的語意是「CI 要不要
      # 擋」,只有 defect 會非零;而 `analysis_not_specialized`(Luna 落回
      # legacy)這種**最該通知**的事是 degraded —— 綁退出碼的話,這套機制
      # 當初要抓的那件事自己不會發告警。
      - name: 本班品質自評(不影響 job 成敗)
        id: quality
        if: ${{ always() && !cancelled() && steps.report.outputs.run_outcome == 'delivered' }}
        continue-on-error: true
        env:
          TZ: Asia/Taipei
        run: python tools/assert_run_quality.py --mode watchdog

      # 沒有 `always()` 是刻意的:上一步失敗時這一步會被跳過,
      # 壞掉的 state 就留在 runner 上隨之丟棄,不會進 main。
      # `state_dirty` 條件同上:沒改到 state 就沒有東西要發佈。
      - name: 發佈 state(契約通過後才 push)
        if: ${{ steps.report.outputs.state_dirty == 'true' }}
        env:
          TZ: Asia/Taipei
        run: python -c "import morning_report as mr; mr.push_committed_state()"

  # 批#32 r1(Codex F1):告警必須是**獨立 job**。原本放在 send-report 的最後一步,
  # 但 job 撞 timeout-minutes: 25 被 GitHub 終止時,整個 job(含後續步驟)一起被殺
  # ——恰好是最該告警的那種失敗完全不會通知。改用 needs + always() 另起一個 job。
  # **品質告警是獨立 job**(2026-08-31 r1 外審 P1)。`send-report` 保持綠
  # —— 品質有瑕疵不等於晨報沒寄出;但「不變紅」不等於「不通知」,
  # 這個 job 專門消費品質結果。信件內容在 `tools/quality_alert.py`
  # (獨立腳本才測得到,而且 workflow 裡不再有巢狀 heredoc)。
  alert-on-quality:
    needs: send-report
    # **不繼承 workflow 層的 contents: write**(2026-09-01 外審 P2):
    # 這個 job 只要 checkout 程式碼 + 寄 SMTP,不寫 repo。
    permissions:
      contents: read
    if: ${{ always() && (needs.send-report.outputs.quality_alertable == 'true'
            || (needs.send-report.outputs.quality_step_outcome == 'failure'
                && needs.send-report.outputs.quality_assessed != 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
      # 不 continue-on-error:告警寄不出去要紅 —— 靜默成功的告警等於沒有告警。
      - name: 品質告警信
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT: ${{ secrets.RECIPIENT }}
          QUALITY_RECIPIENT: ${{ secrets.QUALITY_RECIPIENT || vars.QUALITY_RECIPIENT }}
          QUALITY_DETAIL: ${{ needs.send-report.outputs.quality_detail }}
          # 讓信分得出「內容降級」與「判準自己失敗、品質狀態不明」。
          QUALITY_STEP_OUTCOME: ${{ needs.send-report.outputs.quality_step_outcome }}
          QUALITY_ASSESSED: ${{ needs.send-report.outputs.quality_assessed }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python tools/quality_alert.py

  alert-on-failure:
    needs: send-report
    # 同上:告警 job 不需要 repo 寫入權。
    permissions:
      contents: read
    if: ${{ always() && (needs.send-report.result == 'failure' || needs.send-report.result == 'cancelled' || needs.send-report.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # 批#32 r3(Codex F2):不再 continue-on-error——告警若寄不出去(例如 Gmail
      # secrets 遺失/改名,而那恰好就是 send-report 失敗的原因),這個 job 必須
      # 「紅」,才會走 GitHub 對 default branch 排程失敗的內建通知作為最後管道。
      # 靜默成功的告警等於沒有告警。
      - name: 失敗告警信
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_RESULT: ${{ needs.send-report.result }}
          # 空字串 = 沒寄出(job 被 timeout/cancel 殺掉時 output 根本不會產生,
          # 而那正是「真的沒寄到」的情形 —— 預設值必須偏向較嚴重的那一邊)。
          DELIVERED: ${{ needs.send-report.outputs.delivered }}
        run: |
          python - <<'PY'
          import os, smtplib, ssl
          from email.message import EmailMessage
          user, pw = os.environ.get("GMAIL_USER"), os.environ.get("GMAIL_APP_PASSWORD")
          if not (user and pw):
              # 缺憑證時**不可**靜默成功:這正是 send-report 失敗的常見原因之一,
              # 靜默 exit 0 會讓告警 job 顯示綠燈而實際沒通知任何人(Codex r3 F2)。
              print("::error title=alert-secrets-missing::"
                    "GMAIL_USER / GMAIL_APP_PASSWORD 未設定,無法寄出晨報失敗告警")
              raise SystemExit(1)
          result = os.environ.get("JOB_RESULT", "unknown")
          # 批#93(第九輪 P1-10):**寄出與否決定這封告警的性質,不只是措辭。**
          # 「信沒寄到」要你現在就去看;「信寄到了但落地檢查失敗」影響的是明天
          # 以後的晨報。兩者混成同一句「收件人可能沒有收到信」的代價是誤報 ——
          # 而誤報會訓練收件人忽略告警,下一次真的沒寄出時就沒人理了。
          # `delivered` 由晨報在寄信成功後自己寫,不從步驟成敗反推。
          delivered = os.environ.get("DELIVERED", "").strip() == "true"
          if delivered:
              subject = f"⚠ 晨報已寄出，但事後檢查失敗({result})"
              lead = ("今日晨報已經寄到你的信箱——這封是**事後檢查**的告警。"
                      + os.linesep
                      + "寄信之後的步驟失敗了，代表落地的資料可能有問題，"
                      "會影響明天以後的晨報，但今天這封信本身是完整的。")
              hint = "常見原因：state schema 契約失敗、state push 衝突、信件存檔寫入失敗。"
          else:
              subject = f"⚠ 晨報未寄出({result})"
              lead = "今日晨報 workflow 未成功完成，收件人可能沒有收到信。"
              hint = "常見原因：上游來源卡住撞 job timeout、被 concurrency 取消、寄信失敗。"
          m = EmailMessage()
          m["Subject"] = subject
          m["From"] = user
          m["To"] = user          # 只寄給自己
          m.set_content(
              lead
              + os.linesep * 2
              + f"結果: {result}" + os.linesep
              + f"執行紀錄: {os.environ.get('RUN_URL','')}" + os.linesep * 2
              + hint)
          with smtplib.SMTP_SSL("smtp.gmail.com", 465,
                                context=ssl.create_default_context(), timeout=60) as s:
              s.login(user, pw)
              s.send_message(m)
          print("[alert] sent")
          PY
