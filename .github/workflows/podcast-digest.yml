name: Podcast Digest

# 與晨報完全獨立:每天台北 04:00(UTC 20:00 前一日)轉錄前夜上架的財經 podcast
# (股癌/財經皓角/財報狗),faster-whisper 本地轉錄(免費)→ DeepSeek 摘要,
# 寫入 state/podcast_digest.json 並 push。晨報(UTC 22:00)checkout 即讀到;
# 本 job 失敗不影響寄信。轉錄較慢(50 分鐘集約 10-25 分),故提早到 04:00。
on:
  schedule:
    # 台北 03:30(UTC 19:30 前一日):預算滿載(150 分音檔 ≈ 60-75 分轉錄)
    # 也能在晨報(UTC 22:00)前完成並 push
    - cron: "30 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: podcast-digest
  cancel-in-progress: true

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Cache whisper models
        # 核心節目用 medium(~1.5GB)轉錄較準;快取模型避免每日重新下載、保住 job 預算
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: faster-whisper-small-medium-v1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests faster-whisper

      - name: Prefetch whisper models
        # 一律下載 small + medium,確保 cache miss 時兩個模型一起被存進快取
        # (exact-key 命中時 actions/cache 不會再存,否則 medium 會每天重抓)。
        run: |
          python -c "from faster_whisper import WhisperModel; WhisperModel('small', device='cpu', compute_type='int8'); WhisperModel('medium', device='cpu', compute_type='int8')"

      - name: Run podcast digest
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PODCAST_DEEPSEEK_MODEL: deepseek-v4-flash
          PODCAST_WHISPER_MODEL: small
          PODCAST_DAILY_BUDGET_MIN: "300"
          PODCAST_JOB_BUDGET_MIN: "95"
        run: python podcast_digest.py

      - name: Commit & push state
        run: |
          git config user.name "morning-report-bot"
          git config user.email "actions@github.com"
          git add state/podcast_digest.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update podcast digest [skip ci]"
            git pull --rebase --autostash
            git push
          else
            echo "no digest changes"
          fi
