name: Podcast Digest

# 與晨報完全獨立:轉錄上架的財經 podcast(股癌/財經皓角/科技報橘…),
# faster-whisper 本地轉錄(免費)→ DeepSeek 摘要,寫入 state/podcast_digest.json 並 push。
# 晨報(UTC 22:00)checkout 即讀到;本 job 失敗不影響寄信。
# 一天跑 4 次(每 6 小時):(A) 提高抓取頻率 + 清轉錄積壓(忙日一次跑不完的 backlog 當天就補完);
# (B) 最後一跑 19:30 UTC(03:30 台北)為「寄信前最後一抓」,約 21:10 UTC 完成並 push,
# 與晨報 22:00 UTC checkout 之間留 ~35 分緩衝(即使 cron 延遲也能趕上;真來不及則退用前一輪)。
# 先天限制:在晨報送出時(06:00 台北)尚未上架的集仍只能隔天收錄。
on:
  schedule:
    # UTC;台北 = UTC+8。各次自帶 95 分(PODCAST_JOB_BUDGET_MIN)上限,無新集即秒退。
    - cron: "30 1 * * *"    # 09:30 台北
    - cron: "30 7 * * *"    # 15:30 台北
    - cron: "30 13 * * *"   # 21:30 台北
    - cron: "30 19 * * *"   # 03:30 台北 — 寄信前最後一抓(B),晨報前完成並入庫
  workflow_dispatch:

permissions:
  contents: write

# 與 morning-report 共用 state-writers group(四審 P1-6):兩者都寫
# state/podcast_digest.json,必須互斥序列化;一律不取消,卡死由 timeout 兜底
concurrency:
  group: state-writers
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Cache whisper models
        # 核心節目用 medium(~1.5GB)轉錄較準;快取模型避免每日重新下載、保住 job 預算
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/huggingface
          key: faster-whisper-small-medium-v1

      - name: Install dependencies
        run: |
          # 批#35 r2(Codex):**不**升級 pip——未鎖版 pip 會被下載並立即執行,
          # 而本 job 持有寫入權限/金鑰;runner 內建 pip 已足以做 --require-hashes 安裝。
          # 批#35:改用鎖版+hash。原本是未鎖版 `pip install feedparser requests
          # faster-whisper`,一天 4 班每次重新解析最新版,而本 job 同時持有
          # contents: write 與 DEEPSEEK_API_KEY——相依鏈(ctranslate2/tokenizers/
          # huggingface-hub/onnxruntime/av…)任一被投毒即可在安裝或 import 時
          # 以 GITHUB_TOKEN 身分 commit 進 main(下一班晨報就會執行它)。
          # requirements.lock 的 hash 保護在這條路徑上原本完全被繞過。
          pip install -r requirements-podcast.lock

      - name: Prefetch whisper models
        # 一律下載 small + medium,確保 cache miss 時兩個模型一起被存進快取
        # (exact-key 命中時 actions/cache 不會再存,否則 medium 會每天重抓)。
        run: |
          python -c "from faster_whisper import WhisperModel; WhisperModel('small', device='cpu', compute_type='int8'); WhisperModel('medium', device='cpu', compute_type='int8')"

      - name: Run podcast digest
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PODCAST_DEEPSEEK_MODEL: deepseek-v4-flash
          PODCAST_WHISPER_MODEL: small
          PODCAST_DAILY_BUDGET_MIN: "300"
          PODCAST_JOB_BUDGET_MIN: "95"
        run: python podcast_digest.py

      - name: Commit & push state
        run: |
          git config user.name "morning-report-bot"
          git config user.email "actions@github.com"
          git add state/podcast_digest.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update podcast digest [skip ci]"
            # 重試政策集中在 tools/push_state.sh(2026-08-13 #235:
            # GitHub 500 讓這一班的 digest 整批掉了,而這裡沒有重試)
            bash tools/push_state.sh
          else
            echo "no digest changes"
          fi
