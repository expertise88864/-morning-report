# 檔名的 `-a`:排程註冊急救(說明見 morning-report-b.yml 檔頭)。
name: Morning Report Watchdog

# 台北 07:50(UTC 23:50)——晨報排程是 21:07/21:52/22:42 UTC(2026-08-31 前移),
# 給足緩衝再檢查,避免因為排隊延遲就誤報。
on:
  schedule:
    # 看門狗自己也會被 GitHub 丟掉(2026-08-27:晨報與看門狗**同一天
    # 一起沒跑**,而它正是要通知這件事的那個機制)。移離整點半。
    #
    # **要排在補漏跑「最晚可能結束」之後,不是它的 cron 之後**
    # (r1 外審):看門狗排在補漏跑的名目結束時間之前,會讀到昨天的
    # manifest,對著**還在跑**的那一班發「晨報沒有跑起來」的假警報 ——
    # 假警報會讓人把看門狗關掉,那比沒有看門狗更糟。餘裕由
    # `tests/test_batch_backup_cron.py` 用兩個 workflow 的實際值算出來釘住。
    # 2026-08-28:排程註冊卡死的 touch;2026-09-01 檔名 -a→-b 第二次急救
    # (改 cron 會讓排程註冊卡死,說明見 morning-report-b.yml 檔頭)
    # 2026-08-31:晨報整組前移一小時(09:00 SLA),看門狗跟著前移 ——
    # 補漏跑二最晚 22:42Z+15 分延遲+50 分 job = 23:47Z 寫完 manifest,
    # 23:50Z 在其後。它自己也會被 GitHub 拖(08/30 實測晚 4 小時 51 分),
    # 但補寄判準有「有人在跑就不插隊」擋著,早到晚到都不會重複寄。
    # 07:50 準時補寄 → 信約 08:30 到,仍在 SLA 內;它也大延遲時是共模
    # 失效,repo 端無解(外部鬧鐘使用者暫緩)。
    - cron: "50 23 * * *"
  workflow_dispatch:

permissions:
  contents: read   # 唯讀:看門狗不參與 state 競爭,否則自己會變成問題來源
  # **自動補寄**(使用者 2026-08-28 定案)。偵測到今天沒寄成功時,觸發一次
  # 晨報的 `workflow_dispatch`。`GITHUB_TOKEN` 對 `workflow_dispatch` 是防遞迴
  # 規則的**例外**(其他事件用它觸發才不會建立新 run),所以不必另開 PAT。
  # 這不是寫 state 的權限 —— 看門狗仍然不參與 state 競爭。
  actions: write

# **刻意不用 `state-writers`**。morning 與 podcast 共用那個 group 且不取消,
# 一旦某個 run 在 pending 階段被擠掉,job 根本不會啟動、連 workflow 內的告警
# 步驟也不會執行 —— 那正是這個看門狗要覆蓋的失敗模式。若它也排進同一個 group,
# 就會排在它要監看的那個 run 後面,等輪到它時對方早已結束(或它自己也被擠掉)。
concurrency:
  group: report-watchdog
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      # **決定要不要補寄之前,先看 origin/main 當下說什麼**(r9 外審 P1)。
      # 排程觸發的 checkout 檢出的是「排程事件建立當時」的 commit ——
      # 主班在那之後才寄成功的話,看門狗看不到,於是誤判「今天沒寄」
      # 而去補一封。讀不到就不產生檔案(判準另有「有人在跑就不插隊」兜底)。
      - name: 讀取 origin/main 當下的寄送紀錄
        continue-on-error: true
        run: |
          set +e
          git fetch --quiet origin main || exit 0
          git show FETCH_HEAD:state/delivery_receipt.json \
            > "$RUNNER_TEMP/wd_receipt.json" 2>/dev/null \
            || rm -f "$RUNNER_TEMP/wd_receipt.json"
          git show FETCH_HEAD:state/run_manifest.json \
            > "$RUNNER_TEMP/wd_manifest.json" 2>/dev/null \
            || rm -f "$RUNNER_TEMP/wd_manifest.json"
          exit 0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"

      # 回傳碼:0=正常,1=沒跑起來/沒寄到,2=跑起來了但**跑壞了**。
      # 分開是因為要做的事不同:1 要看排程與 concurrency;
      # 2 要看 manifest 說哪一塊沒走完(判準在 `run_quality`)。
      - name: Check last run
        id: check
        run: |
          set +e
          OUT="$(python tools/report_watchdog.py 2>&1)"
          RC=$?
          set -e
          echo "$OUT"
          {
            echo "rc=$RC"
            echo "detail<<WATCHDOG_EOF"
            echo "$OUT"
            echo "WATCHDOG_EOF"
          } >> "$GITHUB_OUTPUT"

      # **補寄跑在告警之前,但不取代告警**(使用者 2026-08-28 定案)。
      # 判準在 `report_watchdog.rescue_decision`(純函式,有測試):
      # 只在 rc=1(今天沒跑起來/沒寄成功)、且今天還沒有任何
      # workflow_dispatch 時才補,一天最多一次;查不出來就不補。
      # 補寄結果寫進告警信 —— 無聲的自動修復會讓「排程壞了」永遠沒人知道。
      - name: Auto rescue
        id: rescue
        if: steps.check.outputs.rc == '1'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WATCHDOG_AUTO_RESCUE: ${{ vars.WATCHDOG_AUTO_RESCUE || '1' }}
          # origin/main 當下的結論(上一步 fetch 出來的)。checkout 是
          # 排程事件建立當時的舊快照,只信它會誤判 → 多寄一封(r9 外審 P1)。
          WATCHDOG_FRESH_RECEIPT: ${{ runner.temp }}/wd_receipt.json
          WATCHDOG_FRESH_MANIFEST: ${{ runner.temp }}/wd_manifest.json
        run: python tools/report_watchdog.py --rescue

      - name: Alert
        if: steps.check.outputs.rc != '0'
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT: ${{ secrets.RECIPIENT }}
          # [晨報品質](rc=2)只寄品質信箱(使用者指定 2026-08-13):
          # 主收件人只想收晨報本體;品質告警是維運訊號,分流。
          # 要換位址時設 repo variable QUALITY_RECIPIENT 蓋過預設。
          # 位址走 repo variable(公開 repo 不放個人信箱;外審 P2-3)。
          # 沒設時 Python 端回退主收件人 —— 告警不可斷。
          QUALITY_RECIPIENT: ${{ secrets.QUALITY_RECIPIENT || vars.QUALITY_RECIPIENT }}
          WATCHDOG_RC: ${{ steps.check.outputs.rc }}
          WATCHDOG_DETAIL: ${{ steps.check.outputs.detail }}
          # 補寄結果一起進告警信:自動修復不可以是無聲的,否則
          #「排程壞了」這件事永遠沒有人知道(而它已經連壞三天)。
          WATCHDOG_RESCUE: ${{ steps.rescue.outputs.note }}
        run: |
          python - <<'PY'
          import os, smtplib, ssl, datetime as dt
          from email.message import EmailMessage
          user = os.environ.get("GMAIL_USER", "")
          pwd = os.environ.get("GMAIL_APP_PASSWORD", "")
          to = os.environ.get("RECIPIENT", "") or user
          if not (user and pwd and to):
              raise SystemExit("[watchdog] 缺少寄信憑證,無法告警")
          tpe = dt.timezone(dt.timedelta(hours=8))
          now = dt.datetime.now(tpe).strftime("%Y-%m-%d %H:%M")
          msg = EmailMessage()
          rc = os.environ.get("WATCHDOG_RC", "1")
          if rc == "2":
              # 品質告警分流;沒設品質信箱就回到原收件人(告警不可斷)
              to = os.environ.get("QUALITY_RECIPIENT", "").strip() or to
          # **主旨要分得出兩件事**:沒有信、與信比它該有的樣子差 ——
          # 緊急程度與該做的事都不同,共用主旨會讓後者被當成前者忽略。
          if rc == "2":
              msg["Subject"] = f"[晨報品質] {now} 信寄出了,但有段落沒跑成"
          else:
              msg["Subject"] = f"[晨報看門狗] {now} 今天的晨報可能沒有跑起來"
          msg["From"], msg["To"] = user, to
          detail = os.environ.get("WATCHDOG_DETAIL", "").strip()
          # **內文要對得上主旨。** 先前這裡寫死「時間戳超過門檻」的
          # 可能原因 —— 品質告警共用它的話,信會說一件沒發生的事,
          # 而那比沒有告警更難查。
          if rc == "2":
              body = (
                  "晨報跑起來也寄出去了,但**有段落沒跑成** —— 收件人今天\n"
                  "拿到的比它該有的樣子少。判準見 `run_quality.assess()`。\n\n"
                  f"{detail}\n\n"
                  "severity 的差別:\n"
                  "  defect   —— 程式或接線壞了(例:特化輸出被自己的驗證擋下、\n"
                  "               兩階段抓取整段 no-op、昨日觀點沒存下來)\n"
                  "  degraded —— 讀者今天少拿到東西,但可能是外部因素\n"
                  "               (額度、服務不穩)\n\n"
                  "2026-08-04 → 08-08 連續五天走的正是這條路,而當時沒有\n"
                  "任何東西會發出這封信。\n")
          else:
              body = (
                  "看門狗在台北 07:50 檢查 state/run_manifest.json,發現最後一次\n"
                  "執行的時間戳超過門檻,或有執行但沒有成功寄出。可能原因:\n"
                  "  - 排程 run 在 pending 階段被 state-writers group 的其他 run 擠掉\n"
                  "    (job 不會啟動,workflow 內的告警步驟也不會執行)\n"
                  "  - GitHub Actions 排程延遲或當機\n"
                  "  - 執行中途失敗且未寫入 manifest\n\n"
                  f"{detail}\n\n"
                  "請到 Actions 頁面查看 Morning Report 的最近一次執行。\n")
          # 自動補寄的結果(2026-08-28):有補要說,沒補要說為什麼不補。
          # 「已觸發」不等於「信會到」—— 那一班照樣可能失敗,所以這裡
          # 只宣稱送出了觸發,不宣稱結果。
          rescue = os.environ.get("WATCHDOG_RESCUE", "").strip()
          if rescue:
              body += f"\n自動補寄:{rescue}\n(已觸發不等於已寄到,請確認信箱)\n"
          msg.set_content(body)
          with smtplib.SMTP("smtp.gmail.com", 587) as s:
              s.starttls(context=ssl.create_default_context())
              s.login(user, pwd)
              s.send_message(msg)
          print("[watchdog] 告警信已寄出")
          PY

      - name: Fail the run so it is visible in the Actions list
        if: steps.check.outputs.rc != '0'
        run: exit 1
