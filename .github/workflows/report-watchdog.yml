name: Morning Report Watchdog

# 台北 07:30(UTC 23:30)——晨報排程是 22:00 UTC,Actions 常延遲 5-15 分,
# 給足緩衝再檢查,避免因為排隊延遲就誤報。
on:
  schedule:
    - cron: "30 23 * * *"
  workflow_dispatch:

permissions:
  contents: read   # 唯讀:看門狗不參與 state 競爭,否則自己會變成問題來源

# **刻意不用 `state-writers`**。morning 與 podcast 共用那個 group 且不取消,
# 一旦某個 run 在 pending 階段被擠掉,job 根本不會啟動、連 workflow 內的告警
# 步驟也不會執行 —— 那正是這個看門狗要覆蓋的失敗模式。若它也排進同一個 group,
# 就會排在它要監看的那個 run 後面,等輪到它時對方早已結束(或它自己也被擠掉)。
concurrency:
  group: report-watchdog
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"

      # 回傳碼:0=正常,1=沒跑起來/沒寄到,2=跑起來了但**跑壞了**。
      # 分開是因為要做的事不同:1 要看排程與 concurrency;
      # 2 要看 manifest 說哪一塊沒走完(判準在 `run_quality`)。
      - name: Check last run
        id: check
        run: |
          set +e
          OUT="$(python tools/report_watchdog.py 2>&1)"
          RC=$?
          set -e
          echo "$OUT"
          {
            echo "rc=$RC"
            echo "detail<<WATCHDOG_EOF"
            echo "$OUT"
            echo "WATCHDOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Alert
        if: steps.check.outputs.rc != '0'
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT: ${{ vars.RECIPIENT || secrets.RECIPIENT }}
          WATCHDOG_RC: ${{ steps.check.outputs.rc }}
          WATCHDOG_DETAIL: ${{ steps.check.outputs.detail }}
        run: |
          python - <<'PY'
          import os, smtplib, ssl, datetime as dt
          from email.message import EmailMessage
          user = os.environ.get("GMAIL_USER", "")
          pwd = os.environ.get("GMAIL_APP_PASSWORD", "")
          to = os.environ.get("RECIPIENT", "") or user
          if not (user and pwd and to):
              raise SystemExit("[watchdog] 缺少寄信憑證,無法告警")
          tpe = dt.timezone(dt.timedelta(hours=8))
          now = dt.datetime.now(tpe).strftime("%Y-%m-%d %H:%M")
          msg = EmailMessage()
          rc = os.environ.get("WATCHDOG_RC", "1")
          # **主旨要分得出兩件事**:沒有信、與信比它該有的樣子差 ——
          # 緊急程度與該做的事都不同,共用主旨會讓後者被當成前者忽略。
          if rc == "2":
              msg["Subject"] = f"[晨報品質] {now} 信寄出了,但有段落沒跑成"
          else:
              msg["Subject"] = f"[晨報看門狗] {now} 今天的晨報可能沒有跑起來"
          msg["From"], msg["To"] = user, to
          detail = os.environ.get("WATCHDOG_DETAIL", "").strip()
          # **內文要對得上主旨。** 先前這裡寫死「時間戳超過門檻」的
          # 可能原因 —— 品質告警共用它的話,信會說一件沒發生的事,
          # 而那比沒有告警更難查。
          if rc == "2":
              body = (
                  "晨報跑起來也寄出去了,但**有段落沒跑成** —— 收件人今天\n"
                  "拿到的比它該有的樣子少。判準見 `run_quality.assess()`。\n\n"
                  f"{detail}\n\n"
                  "severity 的差別:\n"
                  "  defect   —— 程式或接線壞了(例:特化輸出被自己的驗證擋下、\n"
                  "               兩階段抓取整段 no-op、昨日觀點沒存下來)\n"
                  "  degraded —— 讀者今天少拿到東西,但可能是外部因素\n"
                  "               (額度、服務不穩)\n\n"
                  "2026-08-04 → 08-08 連續五天走的正是這條路,而當時沒有\n"
                  "任何東西會發出這封信。\n")
          else:
              body = (
                  "看門狗在台北 07:30 檢查 state/run_manifest.json,發現最後一次\n"
                  "執行的時間戳超過門檻,或有執行但沒有成功寄出。可能原因:\n"
                  "  - 排程 run 在 pending 階段被 state-writers group 的其他 run 擠掉\n"
                  "    (job 不會啟動,workflow 內的告警步驟也不會執行)\n"
                  "  - GitHub Actions 排程延遲或當機\n"
                  "  - 執行中途失敗且未寫入 manifest\n\n"
                  f"{detail}\n\n"
                  "請到 Actions 頁面查看 Morning Report 的最近一次執行。\n")
          msg.set_content(body)
          with smtplib.SMTP("smtp.gmail.com", 587) as s:
              s.starttls(context=ssl.create_default_context())
              s.login(user, pwd)
              s.send_message(msg)
          print("[watchdog] 告警信已寄出")
          PY

      - name: Fail the run so it is visible in the Actions list
        if: steps.check.outputs.rc != '0'
        run: exit 1
