# LLM 設定金絲雀(第九輪 P1-5)。
#
# 2026-08-01 一天之內兩次:設定有問題,而**發現的方式是早上六點的信壞掉**。
# 這個 workflow 把回饋管道往前搬 —— 手動觸發、**不寄信、不寫 state**,
# 只回答「模型存在嗎、推理強度收得下嗎、結構化輸出支援嗎、跑一次要多久」。
#
# 刻意只有 workflow_dispatch:它會花掉少量 API 額度,不該每次 push 都跑。
name: Validate LLM Config

on:
  workflow_dispatch:

# 與晨報**不共用** concurrency group:它不寫 state,不會與寫入者衝突,
# 而且要能在晨報跑的時候同時查設定。
concurrency:
  group: llm-canary
  cancel-in-progress: true

permissions:
  contents: read      # 只讀 —— 這個 workflow 不得寫任何東西回 repo

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
      - name: 檢查 LLM 設定
        env:
          # 與晨報讀**同一組** repo variable —— 金絲雀查的必須是正式排程會用的
          # 那份設定,自己另設一份就等於在驗一個不存在的情境。
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'deepseek' }}
          EXTRACTOR_PROVIDER: ${{ vars.EXTRACTOR_PROVIDER || '' }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6-terra' }}
          OPENAI_EXTRACTOR_MODEL: ${{ vars.OPENAI_EXTRACTOR_MODEL || 'gpt-5.6-luna' }}
          OPENAI_REASONING_EFFORT: ${{ vars.OPENAI_REASONING_EFFORT || 'medium' }}
          # r1(Codex,#7):**這幾行原本不存在。** 沒有 OPENAI_API_MODE,
          # 探測會用預設 chat_completions 而**靜默略過** Responses strict 探測
          # —— job 照樣綠,而它宣稱驗過的正是那條新路徑。
          OPENAI_API_MODE: ${{ vars.OPENAI_API_MODE || 'chat_completions' }}
          OPENAI_TEXT_VERBOSITY: ${{ vars.OPENAI_TEXT_VERBOSITY || 'high' }}
          OPENAI_REASONING_SUMMARY: ${{ vars.OPENAI_REASONING_SUMMARY || 'auto' }}
          OPENAI_REASONING_CONTEXT: ${{ vars.OPENAI_REASONING_CONTEXT || 'current_turn' }}
          OPENAI_EXTRACTOR_REASONING: ${{ vars.OPENAI_EXTRACTOR_REASONING || 'low' }}
          LLM_SHADOW_PROVIDER: ${{ vars.LLM_SHADOW_PROVIDER || '' }}
          LLM_SHADOW_MODEL: ${{ vars.LLM_SHADOW_MODEL || '' }}
          LLM_SHADOW_REASONING_EFFORT: ${{ vars.LLM_SHADOW_REASONING_EFFORT || '' }}
          DEEPSEEK_REASONING_EFFORT: ${{ vars.DEEPSEEK_REASONING_EFFORT || 'max' }}
          # 第十輪 P0-1:**只有金絲雀真的會呼叫的 provider 才給金鑰。**
          # 其餘 provider 這裡只需要知道「有沒有設」—— 用布林旗標,
          # 金鑰就不會進到這個 process 的環境。
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_KEY_PRESENT: ${{ secrets.DEEPSEEK_API_KEY != '' }}
          GEMINI_KEY_PRESENT: ${{ secrets.GEMINI_API_KEY != '' }}
          ANTHROPIC_KEY_PRESENT: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: python tools/validate_llm_config.py

  # 第十輪 P1-3:**每個 provider 都要發真請求。**
  # 原本只有 OpenAI 被實測,其餘只檢查「有沒有 key」—— 而這個 workflow 叫
  # `Validate LLM Config`,很容易讓人以為每家都驗過了。
  #
  # 用 matrix 而不是塞進上面那個 job,是為了同時滿足 P0-1 的金鑰隔離:
  # **每個 job 只拿自己那一把**。沒被選用的 provider 缺金鑰不算失敗。
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        provider: [openai, deepseek, gemini, anthropic]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
      - name: 探測 ${{ matrix.provider }}
        env:
          CANARY_PROVIDER: ${{ matrix.provider }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'deepseek' }}
          EXTRACTOR_PROVIDER: ${{ vars.EXTRACTOR_PROVIDER || '' }}
          LLM_SHADOW_PROVIDER: ${{ vars.LLM_SHADOW_PROVIDER || '' }}
          # r1(Codex,#1):**這一行原本不存在。** 程式已經會在「只當影子」時
          # 改探測影子模型,而 matrix job 沒把變數傳進來 —— 於是它落回主分析
          # 的模型,影子模型名打錯照樣綠。機制做好了、接線沒接,是本 repo
          # 反覆出現的形狀,而我自己的測試注入環境變數,正好驗不到接線。
          LLM_SHADOW_MODEL: ${{ vars.LLM_SHADOW_MODEL || '' }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6-terra' }}
          DEEPSEEK_MODEL: deepseek-v4-pro
          GEMINI_MODEL: gemini-2.5-flash
          CLAUDE_MODEL: claude-sonnet-4-6
          # r2(Codex,#6):**strict 探測是在這個 job 裡跑的,不是 canary job。**
          # 我 r1 只把變數加到 canary,於是 `probe_responses_strict` 仍然看到
          # 預設的 chat_completions 而**靜默略過** —— job 照樣綠,
          # 而它宣稱驗過的正是那條新路徑。
          OPENAI_REASONING_EFFORT: ${{ vars.OPENAI_REASONING_EFFORT || 'medium' }}
          OPENAI_API_MODE: ${{ vars.OPENAI_API_MODE || 'chat_completions' }}
          OPENAI_TEXT_VERBOSITY: ${{ vars.OPENAI_TEXT_VERBOSITY || 'high' }}
          OPENAI_REASONING_SUMMARY: ${{ vars.OPENAI_REASONING_SUMMARY || 'auto' }}
          OPENAI_REASONING_CONTEXT: ${{ vars.OPENAI_REASONING_CONTEXT || 'current_turn' }}
          # **只給這一個 provider 的金鑰**:matrix 的其他 job 拿不到它。
          OPENAI_API_KEY: ${{ matrix.provider == 'openai' && secrets.OPENAI_API_KEY || '' }}
          DEEPSEEK_API_KEY: ${{ matrix.provider == 'deepseek' && secrets.DEEPSEEK_API_KEY || '' }}
          GEMINI_API_KEY: ${{ matrix.provider == 'gemini' && secrets.GEMINI_API_KEY || '' }}
          ANTHROPIC_API_KEY: ${{ matrix.provider == 'anthropic' && secrets.ANTHROPIC_API_KEY || '' }}
        run: python tools/validate_llm_config.py
