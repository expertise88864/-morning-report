name: Whisper Benchmark

# OPTIMIZATION_PLAN V2 · N6:**只產報告,不換模型。**
#
# 現行核心節目用 `medium` 轉錄(`WHISPER_MODEL_HIGH`)。`large-v3-turbo` 據稱
# 更快且更準,但那是別人的 benchmark —— 這個 job 在**我們自己的 runner、
# 我們自己的節目**上量,輸出耗時、字數與抽樣段落對照,交使用者判讀。
#
# **刻意只有 workflow_dispatch:它不會自己跑。** 換模型是使用者的決定
# (計劃書:「換模型需使用者看過同意」),而這個 job 每跑一次要下載
# 兩個模型並轉錄整集,成本不低。
on:
  workflow_dispatch:
    inputs:
      show:
        description: "節目 key(見 podcast_digest.PODCASTS;預設股癌)"
        required: false
        default: "gooaye"
      minutes:
        description: "只轉錄前幾分鐘(控制成本;0 = 整集)"
        required: false
        default: "15"

permissions:
  contents: read          # **唯讀**:這個 job 不寫 state、不 commit

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Cache whisper models
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: ~/.cache/huggingface
          key: faster-whisper-bench-medium-largev3turbo-v1

      - name: Install dependencies
        # 與 podcast-digest 同一份鎖檔 + hash 保護(批#35 的理由同樣適用:
        # 未鎖版相依鏈在安裝或 import 時就會執行)。
        run: pip install -r requirements-podcast.lock

      - name: Run benchmark
        env:
          BENCH_SHOW: ${{ inputs.show }}
          BENCH_MINUTES: ${{ inputs.minutes }}
        run: python tools/whisper_benchmark.py

      - name: Upload report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: whisper-benchmark
          path: whisper_benchmark/
          retention-days: 14
