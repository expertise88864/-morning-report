; ASCII only. mypy reads this file with the locale codec, so on a cp950/gbk
; console the Chinese comments this repo uses everywhere else would raise
; UnicodeDecodeError before a single line is checked (measured 2026-09-04).
; The full reasoning lives in tests/test_typing_boundary_0904.py.
;
; Boundary-first, and the list only grows: every module here is annotated to
; zero errors under --strict. Add a module by fixing it, not by relaxing rules.
[mypy]
python_version = 3.11
strict = True
files =
    state_publish.py,
    state_store.py,
    degradation_registry.py,
    tools/env_drift.py,
    tools/ci_pytest_annotations.py
