# r3(突變測試審查):repo 先前**完全沒有 pytest 設定檔**。實測把五個會打真實
# 網路的測試導到黑洞 IP 後,光兩個測試檔就跑了 12 分 29 秒 > ci.yml 的
# timeout-minutes: 10 → job 會被 GitHub 砍掉、CI 紅燈,而且與程式碼無關。
#
# **這個檔目前沒有 per-test timeout**(全案審查 2026-09-03 DC-3):上面那次事故
# 真正的解法是 `tests/conftest.py::_block_outbound_network`(擋掉網路呼叫本身),
# 不是設時限;`pytest-timeout` 不在 `requirements.lock` 裡,而 lock 是 hash 鎖
# (`--require-hashes`),手動加一行會讓 CI 裝不起來 —— 要加得走 lock-refresh。
# 所以非網路原因的掛住(死結、卡住的 fixture)目前仍只能靠 job 層的 10 分鐘兜底。
# 先前的註解讓人以為這裡已經有單一測試逾時,那是假的。
[pytest]
testpaths = tests
addopts = --strict-markers
# `--strict-markers` 只有在標記**登記在這裡**時才放行。2026-09-04:
# `@pytest.mark.slow` 沒登記,本機 pytest 9.0.3 放過、CI 的 9.1.1 擋下 ——
# 收集階段錯誤、退出碼 2,而 CI 連紅三個 commit 我都以為是別的原因。
# 守衛在 tests/test_pytest_markers_registered.py(不依賴 pytest 版本)。
markers =
    slow: 跑真的 main() 之類的重測試(不是預設排除,只是標出來)
    incident: 對應一次真實事故或外審 finding 的回歸測試(由 tests/conftest.py 依目錄自動套用)
filterwarnings =
    default
# **實測**(2026-09-04):預設的 xunit2 家族在 testcase 上**沒有** file/line,
# 收集錯誤的 classname 還是空的 —— 由它產生的 annotation 會指到 `file=`(空)
# 或少了 `.py` 的路徑,等於指不到地方。legacy 家族兩者都有(收集錯誤也有 file)。
# 放在這裡而不是命令列:tools/preflight.sh 與 ci.yml 的指令必須**逐字相同**
# (test_preflight_runs_exactly_what_ci_gates_on),設定只能有一個地方。
junit_family = legacy
