# r3(突變測試審查):repo 先前**完全沒有 pytest 設定檔**。實測把五個會打真實
# 網路的測試導到黑洞 IP 後,光兩個測試檔就跑了 12 分 29 秒 > ci.yml 的
# timeout-minutes: 10 → job 會被 GitHub 砍掉、CI 紅燈,而且與程式碼無關。
#
# **這個檔目前沒有 per-test timeout**(全案審查 2026-09-03 DC-3):上面那次事故
# 真正的解法是 `tests/conftest.py::_block_outbound_network`(擋掉網路呼叫本身),
# 不是設時限;`pytest-timeout` 不在 `requirements.lock` 裡,而 lock 是 hash 鎖
# (`--require-hashes`),手動加一行會讓 CI 裝不起來 —— 要加得走 lock-refresh。
# 所以非網路原因的掛住(死結、卡住的 fixture)目前仍只能靠 job 層的 10 分鐘兜底。
# 先前的註解讓人以為這裡已經有單一測試逾時,那是假的。
[pytest]
testpaths = tests
addopts = --strict-markers
filterwarnings =
    default
